<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>快捷导航</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d9e0e8;
      --accent: #176b87;
      --accent-dark: #124e63;
      --accent-soft: #e3f3f8;
      --danger: #b42318;
      --shadow: 0 10px 28px rgba(31,41,55,.08);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg,rgba(227,243,248,.9),rgba(246,247,249,0) 260px),var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .page { width: min(1180px,calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0 0 6px; font-size: clamp(28px,4vw,42px); font-weight: 760; letter-spacing: 0; }
    .subtitle { margin: 0; color: var(--muted); font-size: 15px; }
    .status { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.78); color: var(--muted); font-size: 13px; white-space: nowrap; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .status.error::before { background: var(--danger); }
    .toolbar { display: grid; grid-template-columns: minmax(220px,1fr) auto; gap: 12px; margin-bottom: 14px; }
    .search { width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); outline: none; }
    .search:focus { border-color: var(--accent); }
    .refresh { min-height: 44px; padding: 10px 20px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: #fff; cursor: pointer; }
    .tabs { margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .tab { padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; font-size: 14px; }
    .tab.active { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
    .tab span { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; background: var(--accent-soft); font-size: 12px; color: var(--accent-dark); }
    .tab.active span { background: #fff; }
    .group { margin: 18px 0; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .group-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .group-head h2 { margin: 0; font-size: 18px; }
    .group-head span { color: var(--muted); font-size: 13px; }
    .link-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 10px; }
    .link-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; transition: .15s; min-width: 0; }
    .link-item:hover { border-color: var(--accent); background: var(--accent-soft); }
    .link-icon { flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .link-text { flex: 1; min-width: 0; }
    .link-text strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-text small { color: var(--muted); font-size: 12px; }
    .message { text-align: center; padding: 40px 20px; color: var(--muted); }
    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: stretch; }
      .link-grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>快捷导航</h1>
        <p class="subtitle">支持搜索、分栏、更新</p>
      </div>
      <div id="status" class="status">正在读取...</div>
    </header>
    <section class="toolbar">
      <input id="search" class="search" type="search" placeholder="搜索名称、类别或网址" autocomplete="off">
      <button id="refresh" class="refresh" type="button">刷新</button>
    </section>
    <nav id="tabs" class="tabs" aria-label="类别"></nav>
    <main id="content"></main>
  </div>
  <script>
    (function() {
      const SHEET_ID = '1bnlRm8CXjfhc7o8Xpalvq5q-JZcwWionZd2vMiLoLlM';
      const SHEET_GID = '0';
      const $ = function(id) { return document.getElementById(id); };
      const content = $('content'), statusEl = $('status'), tabsEl = $('tabs');
      const searchEl = $('search'), refreshEl = $('refresh');
      let allLinks = [], activeCategory = '';
      function setStatus(text, error) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (error ? ' error' : '');
      }
      function esc(v) { return String(v).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
      function gc(row, i) { const cell = row.c[i]; return cell ? String(cell.f || cell.v || '').trim() : ''; }
      function normUrl(u) { if(!u) return ''; if(/^(https?:|mailto:|tel:)/i.test(u)) return u; return 'https://'+u; }
      function parseRows(rows) {
        const p = rows.map(function(r) { return {category: gc(r,0)||'未分类', name: gc(r,1), url: normUrl(gc(r,2))}; }).filter(function(r){ return r.name && r.url; });
        if(p[0] && /类别|分类/i.test(p[0].category) && /名称|名字|标题/i.test(p[0].name)) p.shift();
        return p;
      }
      function renderTabs(items) {
        const cats=['全部'].concat(Array.from(new Set(items.map(function(i){return i.category;}))));
        tabsEl.innerHTML = cats.map(function(c){
          const cnt = c === '全部' ? items.length : items.filter(function(i){return i.category===c;}).length;
          const active = c===activeCategory?' active':'';
          return '<button class="tab'+active+'" data-cat="'+esc(c)+'">'+esc(c)+' <span>'+cnt+'</span></button>';
        }).join('');
      }
      function render() {
        const q = searchEl.value.trim().toLowerCase();
        let v = allLinks.filter(function(i){ return !activeCategory||activeCategory==='全部'||i.category===activeCategory; });
        if(q) v = v.filter(function(i){ return [i.category,i.name,i.url].join(' ').toLowerCase().indexOf(q)>=0; });
        renderTabs(allLinks);
        if(!v.length){ content.innerHTML='<div class="message">没有找到匹配的链接。</div>'; return; }
        const g = v.reduce(function(a,i){ if(!a[i.category]) a[i.category]=[]; a[i.category].push(i); return a; }, {});
        content.innerHTML = Object.entries(g).map(function(entry){
          const cat = entry[0], links = entry[1];
          return '<section class="group"><div class="group-head"><h2>'+esc(cat)+'</h2><span>'+links.length+' 个链接</span></div><div class="link-grid">'+links.map(function(l){
            return '<a class="link-item" href="'+esc(l.url)+'" target="_blank" rel="noopener"><div class="link-icon">&#x2197;</div><div class="link-text"><strong>'+esc(l.name)+'</strong><small>'+esc(l.url)+'</small></div></a>';
          }).join('')+'</div></section>';
        }).join('');
        setStatus('共 ' + allLinks.length + ' 个链接', false);
      }
      function loadSheet() {
        setStatus('正在读取...');
        const cb = '__naviCB_' + Date.now();
        window[cb] = function(resp) {
          delete window[cb];
          if(resp.status!=='ok'||!resp.table){ setStatus('读取失败：表格权限不足', true); return; }
          allLinks = parseRows(resp.table.rows);
          activeCategory = '全部';
          render();
        };
        const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json;responseHandler:'+cb+';reqId:0&tq=select%20A%2CB%2CC&gid='+SHEET_GID+'&headers=0&_t='+Date.now();
        const s = document.createElement('script'); s.src=url;
        s.onerror = function(){ setStatus('网络错误', true); delete window[cb]; };
        document.body.appendChild(s);
        setTimeout(function(){ if(window[cb]){ setStatus('读取超时', true); delete window[cb]; } }, 15000);
      }
      searchEl.addEventListener('input', render);
      refreshEl.addEventListener('click', function(){ loadSheet(); });
      tabsEl.addEventListener('click', function(e){
        const btn = e.target.closest('.tab');
        if(!btn) return;
        activeCategory = btn.dataset.cat;
        Array.from(tabsEl.children).forEach(function(t){ t.classList.toggle('active', t.dataset.cat===activeCategory); });
        render();
      });
      loadSheet();
    })();
  </script>
</body>
</html>
